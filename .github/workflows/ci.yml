name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # The check job only typechecks, checks formatting, and runs unit tests, so it
      # skips lifecycle scripts: no Electron binary download and no native build
      # (the mac-only glass addon, which self-skips off macOS anyway). Faster and
      # more robust than a full install. The build matrix below does a full install.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Typecheck (node + web)
        run: yarn typecheck

      - name: Prettier check
        run: yarn format:check

      - name: Unit tests
        run: yarn test:run

  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      # Build forks without signing/notarization secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      # Caches live under RUNNER_TEMP, never in the workspace: electron-builder packs the project
      # directory with `files: '**/*'`, so a cache restored inside it ends up inside the app's asar.
      # `runner.temp` is not available in job-level `env` (workflow parse error), so export from a
      # step; this must run before Install dependencies (its postinstall downloads Electron).
      - name: Keep Electron caches out of the workspace
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-cache/electron-builder" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache/electron
            ${{ runner.temp }}/electron-cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-electron-

      # ubuntu-latest is 24.04: rpmbuild is needed for electron-builder's RPM
      # target, and the classic AppImage runtime needs FUSE2 (libfuse2t64 on 24.04).
      - name: Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libfuse2t64

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: yarn build:mac --publish never

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: yarn build:win --publish never

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: yarn build:linux --publish never

      # Installers/packages only. Uploading all of dist/ shipped the full unpacked app trees
      # (hundreds of MB per OS, on every push and PR). `error` so a build that produced no
      # package fails loudly instead of silently uploading nothing.
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfx-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
