appId: com.pdfx.app
productName: PDFx
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  # The app runs entirely from out/ (package.json main is ./out/main/index.js, and the preload and
  # renderer bundles live beside it); the only runtime file outside out/ is the native addon
  # explicitly re-included below. So no TypeScript source needs to ship. '!src/*' only excluded the
  # direct children of src/, which is a trap waiting to spring — exclude the whole tree.
  - '!src/**'
  # Never pack build caches or previous build output. The release workflows used to point
  # ELECTRON_CACHE / ELECTRON_BUILDER_CACHE (and their actions/cache paths) at .cache/ inside the
  # workspace, so `**/*` swept the restored Electron zips straight into the asar: every shipped
  # installer through v1.1.1 carried ~167 MB of cache, and v1.1.0 carried 136 MB more still because
  # its restored cache also held the stale electron-v38.4.0-win32-x64.zip. The workflows now keep
  # those caches under RUNNER_TEMP; these exclusions make it impossible to regress even if a cache
  # (or a stray `dist/`) ever lands in the project directory again.
  - '!.cache/**'
  - '!dist/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.prettierignore,.prettierrc.yaml,.editorconfig,dev-app-update.yml,README.md,SPEC.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/**'
  # Development-only artifacts that must never ship inside the app.
  - '!{CONTRIBUTING.md,vitest.config.mts,.gitattributes,vitest.config.mjs}'
  - '!docs/**'
  - '!.github/**'
  - '!coverage/**'
  - '!**/*.test.{ts,tsx}'
  # electron-builder does NOT honour .gitignore, so name the strays explicitly: the 2.2 MB source
  # icon (the packaged icon comes from buildResources/), TS incremental caches, and any local scratch
  # PDFs a build might otherwise sweep into the asar.
  - '!assets/**'
  - '!**/*.tsbuildinfo'
  - '!.gitignore'
  - '!*.pdf'
  # Ship only the compiled native addon, not its sources or build tree.
  - '!native/**'
  - 'native/build/Release/*.node'
asarUnpack:
  - native/build/Release/*.node
  # Native addons (e.g. koffi's prebuilt PKCS#11 FFI binding) can't be require()d from inside an
  # asar, so they must live unpacked on disk.
  - '**/*.node'
  - node_modules/koffi/**
  - node_modules/@koromix/**
fileAssociations:
  - ext: pdfx
    name: PDFX Collection
    description: PDFX multi-document PDF collection
    role: Viewer
    mimeType: application/x-pdfx
mac:
  category: public.app-category.productivity
win:
  executableName: pdfx
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  maintainer: PDFx Maintainers <maintainers@pdfx.app>
  synopsis: One file. Many documents. Still a PDF.
  description: >-
    PDFx bundles many PDF documents into a single backwards-compatible .pdfx
    file (a valid PDF) and provides a minimal cross-platform viewer and editor.
  icon: build/icon.png
  mimeTypes:
    - application/x-pdfx
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
