appId: com.pdfx.app
productName: PDFx
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  # The app runs entirely from out/ (package.json main is ./out/main/index.js, and the preload and
  # renderer bundles live beside it); the only runtime file outside out/ is the native addon
  # explicitly re-included below. So no TypeScript source needs to ship. '!src/*' only excluded the
  # direct children of src/, which is a trap waiting to spring — exclude the whole tree.
  - '!src/**'
  # Never pack build caches or previous build output. The release workflows used to point
  # ELECTRON_CACHE / ELECTRON_BUILDER_CACHE (and their actions/cache paths) at .cache/ inside the
  # workspace, so `**/*` swept the restored Electron zips straight into the asar: every shipped
  # installer through v1.1.1 carried ~167 MB of cache, and v1.1.0 carried 136 MB more still because
  # its restored cache also held the stale electron-v38.4.0-win32-x64.zip. The workflows now keep
  # those caches under RUNNER_TEMP; these exclusions make it impossible to regress even if a cache
  # (or a stray `dist/`) ever lands in the project directory again.
  - '!.cache/**'
  - '!dist/**'
  # Local-only trees that a `yarn build:win` from a developer checkout would otherwise sweep in
  # (electron-builder ignores .gitignore): Claude Code worktrees (each with a full node_modules)
  # and smoke-test scratch output.
  - '!.claude/**'
  - '!.smoke/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.prettierignore,.prettierrc.yaml,.editorconfig,dev-app-update.yml,README.md,SPEC.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  # Every TypeScript project file (tsconfig.shared.json came with PR1 and slipped past a list).
  - '!tsconfig*.json'
  - '!scripts/**'
  # Development-only artifacts that must never ship inside the app.
  - '!{CONTRIBUTING.md,vitest.config.mts,.gitattributes,vitest.config.mjs}'
  # Shipped as extraResources (resources/licenses/), and the OCR accuracy baseline is test data.
  - '!{THIRD_PARTY_NOTICES.md,build/licenses/**,bench/**,types/**}'
  - '!docs/**'
  - '!.github/**'
  - '!coverage/**'
  - '!**/*.test.{ts,tsx}'
  # electron-builder does NOT honour .gitignore, so name the strays explicitly: the 2.2 MB source
  # icon (the packaged icon comes from buildResources/), TS incremental caches, and any local scratch
  # PDFs a build might otherwise sweep into the asar.
  - '!assets/**'
  - '!**/*.tsbuildinfo'
  - '!.gitignore'
  - '!*.pdf'
  # Ship only the compiled native addon, not its sources or build tree.
  - '!native/**'
  - 'native/build/Release/*.node'
asarUnpack:
  - native/build/Release/*.node
  # Native addons (e.g. koffi's prebuilt PKCS#11 FFI binding) can't be require()d from inside an
  # asar, so they must live unpacked on disk.
  - '**/*.node'
  - node_modules/koffi/**
  - node_modules/@koromix/**
# Licence notices for third-party files bundled into the RENDERER build (devDependencies, so their
# node_modules copies — and LICENSE files — are not packed into the asar). The DejaVu/Bitstream Vera
# licence requires its notice to accompany copies of the font (embedded for non-Latin text export);
# pdf.js (Apache-2.0) is bundled into the renderer. Shipped as resources/licenses/*.
extraResources:
  - from: node_modules/dejavu-fonts-ttf/LICENSE
    to: licenses/DejaVu-Fonts-LICENSE.txt
  - from: node_modules/pdfjs-dist/LICENSE
    to: licenses/pdfjs-dist-LICENSE.txt
  # OCR engine (DESIGN.md §3.2.1): ONLY the simd-lstm core and the four 4.0.0_best_int languages,
  # outside the asar. The utility process checks every byte against
  # src/main/ocr/process/engine-manifest.ts, and engine-manifest.node.test.ts checks these sources.
  - from: node_modules/tesseract.js-core/tesseract-core-simd-lstm.js
    to: ocr/tesseract-core-simd-lstm.js
  - from: node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm
    to: ocr/tesseract-core-simd-lstm.wasm
  - from: node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz
    to: ocr/tessdata/eng.traineddata.gz
  - from: node_modules/@tesseract.js-data/deu/4.0.0_best_int/deu.traineddata.gz
    to: ocr/tessdata/deu.traineddata.gz
  - from: node_modules/@tesseract.js-data/fra/4.0.0_best_int/fra.traineddata.gz
    to: ocr/tessdata/fra.traineddata.gz
  - from: node_modules/@tesseract.js-data/spa/4.0.0_best_int/spa.traineddata.gz
    to: ocr/tessdata/spa.traineddata.gz
  # OCR notices (§3.2.8): every library linked into tesseract-core-simd-lstm.wasm, per the
  # tesseract.js-core v7.0.0 build scripts (THIRD_PARTY_NOTICES.md lists each with the upstream
  # commit its text came from), the tessdata models and THIRD_PARTY_NOTICES.md itself.
  - from: node_modules/tesseract.js-core/LICENSE
    to: licenses/tesseract.js-core-LICENSE.txt
  - from: build/licenses
    to: licenses
    filter:
      - '*.txt'
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
fileAssociations:
  - ext: pdfx
    name: PDFX Collection
    description: PDFX multi-document PDF collection
    role: Viewer
    mimeType: application/x-pdfx
mac:
  category: public.app-category.productivity
win:
  executableName: pdfx
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  maintainer: PDFx Maintainers <maintainers@pdfx.app>
  synopsis: One file. Many documents. Still a PDF.
  description: >-
    PDFx bundles many PDF documents into a single backwards-compatible .pdfx
    file (a valid PDF) and provides a minimal cross-platform viewer and editor.
  icon: build/icon.png
  mimeTypes:
    - application/x-pdfx
# The stock after-install only makes chrome-sandbox setuid when ROOT (running apt/dnf) cannot create
# a user namespace. Hosts that restrict UNPRIVILEGED user namespaces (Ubuntu 24.04+ AppArmor) pass
# that probe as root, leave the helper 0755, and then the app aborts at launch for the real user.
# This template always sets root:root 4755; see docs/LINUX_SETUP.md.
deb:
  afterInstall: &after-install build/linux/after-install.tpl
rpm:
  afterInstall: *after-install
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
